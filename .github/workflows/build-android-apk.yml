name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile & Sign STAT-Psych India APK (v2.0.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17 (OpenJDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Build Tools (aapt, dalvik-exchange, zipalign, apksigner)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            aapt \
            dalvik-exchange \
            zipalign \
            apksigner \
            android-sdk-platform-23

      - name: Install Node Dependencies & Run Clinical Calculator Unit Tests
        run: |
          npm install
          npx tsx --test src/utils/clinicalCalculators.test.ts

      - name: Build & Sign Standalone Android APK
        run: |
          chmod +x scripts/build-apk.sh
          ./scripts/build-apk.sh

      - name: Commit Updated Signed APK Binaries to Repository Branch
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stat-psych-india.apk public/stat-psych-india.apk releases/stat-psych-india-v2.0.0.apk releases/stat-psych-india-v1.0.0.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore(apk): update signed Android APK binaries (v2.0.0) [skip ci]"
            git push
          fi

      - name: Upload Signed APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stat-psych-india-apk
          path: |
            stat-psych-india.apk
            releases/stat-psych-india-v2.0.0.apk
            releases/stat-psych-india-v1.0.0.apk
          if-no-files-found: error

      - name: Publish Signed APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "STAT-Psych India v2.0.0 — Standalone Android APK"
          body: |
            ### STAT-Psych India v2.0.0 — Emergency Psychiatric CDSS (Android APK)
            - **Package ID**: `in.statpsych.cdss`
            - **Version**: `2.0.0` (`versionCode 2`, Signed v1/v2/v3 Release)
            - **Min Android SDK**: Android 5.0+ (API 21+)
            - **What's New in v2.0.0**:
              - **5-Level Treatment Card Architecture**: Standardized Primary Regimen, Explicit Clinical Rationale, Inline Expandable `"Why this option?"` Comparison Drawer, Contraindication & Caution Callouts, and Post-Administration Monitoring across all 24 severity tiers.
              - **Interactive Step 0 Checklist & Bedside Calculators**: Weight-based pediatric dosing, QTc Bazett/Fridericia correction, and Alcohol Withdrawal CIWA-Ar / Lorazepam dosing calculators.
              - **Synchronized Handover Note Generator**: Dynamic Step 0 clearance, active modifiers, and MHCA 2017 Section 94 emergency documentation.
              - **100% Offline Bundle**: All 8 emergency syndromes, 24 sub-pathways, and source evidence registry embedded inside the APK.
          files: |
            stat-psych-india.apk
            releases/stat-psych-india-v2.0.0.apk
            releases/stat-psych-india-v1.0.0.apk
          draft: false
          prerelease: false
